<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local retrieval demo</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:50px auto;padding:0 22px;color:#172b3d;background:#f2f6f8}main{background:#fff;border:1px solid #d6e3e9;border-radius:16px;padding:28px}label{display:block;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;margin:10px 0;font:inherit}button{background:#116b72;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit}section{background:#eef6f7;padding:16px;border-radius:8px;margin-top:20px}</style></head><body><main><p>KRAKENDEV · DEMONSTRATION</p><h1>Local search with fictional sources</h1><p>Try “What date is required for a reservation?” or “What is new in Atlas?”</p><form id="form"><label for="question">Your question</label><input id="question" maxlength="200" value="What date is required for a reservation?" required><button>Run demo</button></form><section aria-live="polite" hidden id="result"><strong>Answer</strong><p id="answer"></p><p id="source"></p></section><p>This keyword search uses fictional documents. It does not execute an LLM, LangGraph, FAISS or web search. It runs offline without sending information.</p></main><script>
// Public demonstration data, created specifically for this portfolio.
const demoSources = [
  { id: 'guide', title: 'Guía de reservas (ficticia)', kind: 'document', text: 'Para confirmar una reserva se necesita una fecha válida y disponibilidad.', keywords: ['reserva', 'reservas', 'fecha', 'confirmar', 'disponibilidad', 'reservation', 'booking', 'date', 'availability'] },
  { id: 'atlas', title: 'Nota de lanzamiento Atlas (ficticia)', kind: 'web', text: 'La versión 2.0 de Atlas incorpora una búsqueda mejorada.', keywords: ['atlas', 'version', 'novedades', 'actualizacion', 'update', 'updates', 'news'] },
];

/**
 * A deterministic local retrieval demonstration, not an LLM or real web search.
 * @param {string} question
 * @returns {{ route: string, answer: string, source: typeof demoSources[number] | null, count: number }}
 */
function runAgentDemo(question) {
  const normalized = question.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const words = normalized.match(/[a-z0-9]+/g) || [];
  const ranked = demoSources.map(source => ({ source, score: source.keywords.filter(word => words.includes(word)).length })).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  if (!ranked.length) return { route: 'Sin fuente', answer: 'No encontré información suficiente en las fuentes de demostración.', source: null, count: 0 };
  const best = ranked[0];
  return { route: best.source.kind === 'web' ? 'Resultado web ficticio' : 'Documento ficticio', answer: best.source.text, source: best.source, count: ranked.length };
}

document.getElementById('form').addEventListener('submit',function(event){event.preventDefault();const result=runAgentDemo(document.getElementById('question').value);document.getElementById('answer').textContent=!result.source?'I could not find enough information in the demo sources.':result.source.id==='guide'?'A valid date and availability are required to confirm a reservation.':'Atlas version 2.0 includes improved search.';document.getElementById('source').textContent=!result.source?'No source found':result.source.id==='guide'?'Source: Reservation guide (fictional)':'Source: Atlas release note (fictional)';document.getElementById('result').hidden=false;});
</script></body></html>
